services:

  archeryutils-service:
    build:
      context: ./archeryutils-service
    container_name: archeryutils-service
    restart: always
    volumes:
      - ./archeryutils-service:/app:rw
    environment:
      - FLASK_ENV=development # !!!
      - FLASK_DEBUG=1
    ports:
      - "84:5000"

  database:
    image: postgres:15-alpine
    container_name: database
    # profiles: ["dev"] # dont run in prod
    restart: always

    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "83:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      target: development
    container_name: backend
    restart: always
    volumes:
      - ./backend:/app:rw
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npx prisma generate && npx prisma db push && npm run dev"
    ports:
      - "82:4000"
    depends_on:
      database:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: frontend
    restart: always
    ports:
      - "81:80"
    depends_on:
      - backend

volumes:
  postgres_data:

